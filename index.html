<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hội nghị Tri ân Khách hàng 2026</title>
  <style>
    :root {
      --green1: #123d24;
      --green2: #1f5a36;
      --cream: #f6efe4;
      --gold: #f3c969;
      --gold-hover: #f7d88d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--cream);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Poster */
    .poster {
      display: block;
      max-width: 720px;
      margin: 0 auto;
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Confirm section */
    .confirm {
      padding: 32px 16px 48px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.16), transparent 38%),
        linear-gradient(170deg, var(--green1), var(--green2));
    }

    .card {
      max-width: 672px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    @media (min-width: 768px) {
      .card {
        padding: 32px;
      }
    }

    .head {
      margin-bottom: 24px;
      text-align: center;
    }

    .eyebrow {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: rgba(253, 230, 138, 0.9);
    }

    .head h1 {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.3;
    }

    @media (min-width: 768px) {
      .head h1 {
        font-size: 30px;
      }
    }

    .head p {
      margin-top: 8px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
    }

    .error {
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1px solid rgba(252, 165, 165, 0.3);
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.15);
      font-size: 14px;
      color: #fee2e2;
    }

    .input,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font: inherit;
      outline: none;
    }

    .input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    .input:focus,
    textarea:focus {
      border-color: var(--gold);
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
    }

    /* Search results */
    .list {
      max-height: 288px;
      margin-top: 12px;
      padding-right: 4px;
      overflow-y: auto;
    }

    .guest {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .guest+.guest {
      margin-top: 8px;
    }

    .guest:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .guest-name {
      font-weight: 600;
    }

    .guest-loc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
    }

    .guest-tag {
      flex-shrink: 0;
      font-size: 12px;
      font-style: italic;
      color: rgba(255, 255, 255, 0.6);
    }

    .guest-done {
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      color: #6ee7b7;
    }

    /* Selected guest */
    .selected {
      margin-top: 20px;
      text-align: center;
    }

    .selected-name {
      font-size: 20px;
      font-weight: 700;
    }

    .selected-loc {
      margin-top: 4px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.75);
    }

    .note-field {
      margin-top: 16px;
      text-align: left;
    }

    .note-field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
    }

    .note-field p {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: var(--gold);
      color: #0f172a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover {
      background: var(--gold-hover);
    }

    .btn:disabled {
      opacity: 0.7;
      cursor: default;
    }

    .btn-ghost {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-weight: 600;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    /* Success */
    .success {
      margin-top: 20px;
      text-align: center;
    }

    .success>svg {
      width: 56px;
      height: 56px;
      color: #6ee7b7;
    }

    .success-name {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 600;
    }

    .success-label {
      margin-top: 8px;
      font-size: 24px;
      font-weight: 800;
      color: var(--gold);
    }

    .success-note {
      max-width: 448px;
      margin: 16px auto 0;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
    }

    .contact {
      margin-top: 24px;
      font-size: 13px;
      text-align: center;
      color: rgba(255, 255, 255, 0.65);
    }

    .contact a {
      color: var(--gold);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <a class="poster" href="customer-tour.jpg" target="_blank" rel="noopener">
    <img src="customer-tour.jpg" alt="Appreciation Trip Đà Nẵng – Sponsored by Tay Do Steel, 30.10 – 01.11.2026">
  </a>

  <section class="confirm" id="xac-nhan">
    <div class="card">
      <div class="head">
        <p class="eyebrow">Năm 2026</p>
        <h1>Xác nhận Tham dự Hội nghị Tri ân Khách hàng 2026</h1>
        <p>Nhập tên khách, chọn đúng thông tin và bấm xác nhận check-in.</p>
      </div>

      <div class="error" id="error" hidden></div>

      <!-- Bước 1: tìm khách -->
      <div id="searchStep">
        <input class="input" id="keyword" placeholder="Nhập họ và tên khách..." autocomplete="off">
        <p class="status" id="status" hidden></p>
        <div class="list" id="list" hidden></div>
      </div>

      <!-- Bước 2: ghi chú + xác nhận -->
      <div class="selected" id="confirmStep" hidden>
        <p class="selected-name" id="selName"></p>
        <p class="selected-loc" id="selLoc"></p>

        <div class="note-field">
          <label for="note">Ghi chú</label>
          <textarea id="note" rows="3" placeholder="Ví dụ: đi cùng 2 người, có trẻ em, cần hỗ trợ..."></textarea>
          <p>Ghi chú để lưu số người đi cùng hoặc thông tin cần nhớ.</p>
        </div>

        <button class="btn" id="confirmBtn">Xác nhận check-in</button>
        <button class="btn btn-ghost" id="backBtn">Chọn khách khác</button>
      </div>

      <!-- Bước 3: đã check-in -->
      <div class="success" id="successStep" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">
          <path d="M21.801 10A10 10 0 1 1 17 3.335" />
          <path d="m9 11 3 3L22 4" />
        </svg>
        <p class="success-name" id="okName"></p>
        <p class="success-label">Đã check-in</p>
        <p class="success-note" id="okNote" hidden></p>

        <button class="btn btn-ghost" id="resetBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          Quay lại xác nhận khác
        </button>
      </div>

      <p class="contact">Hỗ trợ: Bà Phạm Huỳnh Thảo Trân – <a href="tel:0792655068">079 265 5068</a> (Zalo)</p>
    </div>
  </section>

  <script>
    // API: GET {API_BASE}/guests?keyword=..., POST {API_BASE}/guests/confirm { id, note } → { note }.
    // Để trống thì chạy dữ liệu mẫu ngay trên trình duyệt (chỉ để xem UI).
    const API_BASE = '';

    const DEMO_GUESTS = [
      { _id: '1', title: 'Anh', fullName: 'Nguyễn Văn An', location: 'Cần Thơ', note: '', isConfirmed: false },
      { _id: '2', title: 'Chị', fullName: 'Trần Thị Bình', location: 'Đà Nẵng', note: '', isConfirmed: true },
      { _id: '3', title: 'Anh', fullName: 'Lê Minh Châu', location: 'Quảng Nam', note: '', isConfirmed: false },
    ];

    async function searchGuests(keyword) {
      if (!API_BASE) {
        const k = normalize(keyword);
        return DEMO_GUESTS.filter((g) => normalize(g.fullName).includes(k));
      }
      const res = await fetch(`${API_BASE}/guests?keyword=${encodeURIComponent(keyword)}&limit=200`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.errors?.[0] || 'Không tìm thấy dữ liệu');
      return json.data || [];
    }

    async function confirmGuest(id, note) {
      if (!API_BASE) {
        const guest = DEMO_GUESTS.find((g) => g._id === id);
        guest.isConfirmed = true;
        guest.note = note;
        return { note };
      }
      const res = await fetch(`${API_BASE}/guests/confirm`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, note }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.errors?.[0] || 'Xác nhận thất bại');
      return json.data;
    }

    function normalize(s) {
      return s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase().trim();
    }

    const $ = (id) => document.getElementById(id);
    const keywordInput = $('keyword');
    const listEl = $('list');
    const statusEl = $('status');
    const noteInput = $('note');
    const confirmBtn = $('confirmBtn');

    let selected = null;
    let typingTimer = null;
    let loading = false;

    const displayName = (g) => (g.title ? `${g.title} ` : '') + g.fullName;

    function showError(msg) {
      $('error').textContent = msg || '';
      $('error').hidden = !msg;
    }

    function showStep(step) {
      $('searchStep').hidden = step !== 'search';
      $('confirmStep').hidden = step !== 'confirm';
      $('successStep').hidden = step !== 'success';
    }

    function setStatus(msg) {
      statusEl.textContent = msg || '';
      statusEl.hidden = !msg;
    }

    function renderList(guests) {
      listEl.replaceChildren(...guests.map((g) => {
        const btn = document.createElement('button');
        btn.className = 'guest';
        btn.type = 'button';

        const info = document.createElement('div');
        const name = document.createElement('div');
        name.className = 'guest-name';
        name.textContent = displayName(g);
        const loc = document.createElement('div');
        loc.className = 'guest-loc';
        loc.textContent = g.location;
        info.append(name, loc);
        if (g.note) {
          const note = document.createElement('div');
          note.className = 'guest-loc';
          note.style.fontSize = '12px';
          note.textContent = `Ghi chú: ${g.note}`;
          info.append(note);
        }

        const side = document.createElement('div');
        side.className = g.isConfirmed ? 'guest-done' : 'guest-tag';
        side.textContent = g.isConfirmed ? 'Đã check-in' : 'Chưa check-in';

        btn.append(info, side);
        btn.addEventListener('click', () => onSelect(g));
        return btn;
      }));
      listEl.hidden = guests.length === 0;
    }

    async function onSearch(value) {
      if (!value.trim()) {
        renderList([]);
        setStatus('');
        return;
      }

      showError('');
      try {
        setStatus('Đang tìm...');
        const data = await searchGuests(value);
        renderList(data);
        setStatus(data.length ? '' : 'Không tìm thấy khách phù hợp.');
      } catch {
        renderList([]);
        setStatus('Không tìm thấy khách phù hợp.');
      }
    }

    function showSuccess(name, note) {
      $('okName').textContent = name;
      $('okNote').textContent = note ? `Ghi chú: ${note}` : '';
      $('okNote').hidden = !note;
      showStep('success');
    }

    function onSelect(guest) {
      selected = guest;
      renderList([]);
      setStatus('');

      if (guest.isConfirmed) {
        showSuccess(displayName(guest), guest.note);
        return;
      }

      $('selName').textContent = displayName(guest);
      $('selLoc').textContent = `Khu vực: ${guest.location}`;
      noteInput.value = guest.note || '';
      showStep('confirm');
    }

    function resetForm() {
      selected = null;
      keywordInput.value = '';
      noteInput.value = '';
      renderList([]);
      setStatus('');
      showError('');
      showStep('search');
      keywordInput.focus();
    }

    keywordInput.addEventListener('input', () => {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => onSearch(keywordInput.value), 280);
    });

    confirmBtn.addEventListener('click', async () => {
      if (!selected || loading) return;

      try {
        loading = true;
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Đang xác nhận...';
        showError('');

        const data = await confirmGuest(selected._id, noteInput.value.trim());
        showSuccess(displayName(selected), data.note || noteInput.value.trim());
      } catch (err) {
        showError(err.message || 'Xác nhận thất bại');
      } finally {
        loading = false;
        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Xác nhận check-in';
      }
    });

    $('backBtn').addEventListener('click', resetForm);
    $('resetBtn').addEventListener('click', resetForm);
  </script>
</body>

</html>
