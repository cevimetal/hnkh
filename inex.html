<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xem ảnh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .viewer {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-in;
    }

    .viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewer:fullscreen {
      cursor: zoom-out;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font: 14px/1.4 system-ui, sans-serif;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .viewer:fullscreen~.hint,
    .hint.hidden {
      opacity: 0;
    }
  </style>
</head>

<body>
  <div class="viewer" id="viewer">
    <img src="2aOboR7JWLv17FdvPxIPeZ8kh7TVa7NsoHnPX90q.jpg" alt="Hình ảnh">
  </div>
  <div class="hint" id="hint">Nhấn vào ảnh để xem toàn màn hình</div>

  <script>
    const viewer = document.getElementById('viewer');
    const hint = document.getElementById('hint');

    viewer.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (viewer.requestFullscreen) {
        viewer.requestFullscreen();
      } else if (viewer.webkitRequestFullscreen) {
        viewer.webkitRequestFullscreen();
      }
    });

    setTimeout(() => hint.classList.add('hidden'), 4000);
  </script>
</body>

</html>
